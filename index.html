<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werkrew</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    h1 {
      font-weight: 400;
      letter-spacing: 4px;
      font-size: 28px;
      margin: 0 0 24px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin: 10px auto;
      max-width: 520px;
    }

    .gallery {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 40px;
    }

    footer {
      text-align: center;
      padding: 20px 20px 70px;
    }

    a {
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
      padding-bottom: 2px;
    }

    a:hover {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <header>
    <h1>WERKREW</h1>

    <p>
      The new site is under construction and coming soon.
    </p>

    <p>
      Drop me a line at 
      <a href="mailto:hello@werkrew.studio">hello@werkrew.studio</a>
    </p>
  </header>

  <main class="gallery">
    <img src="web - 5.jpeg" alt="Werkrew photography" loading="lazy">
    <img src="web - 1.jpeg" alt="Werkrew photography" loading="lazy">
    <img src="web - 2.jpeg" alt="Werkrew photography" loading="lazy">
    <img src="web - 3.jpeg" alt="Werkrew photography" loading="lazy">
    <img src="web - 4.jpeg" alt="Werkrew photography" loading="lazy">
    <img src="web - 6.jpeg" alt="Werkrew photography" loading="lazy">
    <img src="web - 7.jpeg" alt="Werkrew photography" loading="lazy">
    <img src="web - 9.jpeg" alt="Werkrew photography" loading="lazy">
    <img src="web - 10.jpeg" alt="Werkrew photography" loading="lazy">
  </main>


</body>
</html>
